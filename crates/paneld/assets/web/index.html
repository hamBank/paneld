<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>paneld</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header>
  <h1>paneld</h1>
  <span id="version" class="muted"></span>
  <span id="conn" class="conn" role="img" aria-label="Connecting"></span>
</header>

<main>
  <section id="preview-panel" aria-labelledby="h-preview" hidden>
    <h2 id="h-preview">Preview</h2>
    <img id="preview" alt="Live preview of the panel" width="64" height="32">
  </section>

  <section aria-labelledby="h-status">
    <h2 id="h-status">Status</h2>
    <dl id="status">
      <dt>On screen</dt><dd id="st-scene">-</dd>
      <dt>Mode</dt><dd id="st-mode">-</dd>
      <dt>Power</dt><dd id="st-power">-</dd>
      <dt>Brightness</dt><dd id="st-bright">-</dd>
      <dt>Auto-dim</dt><dd id="st-dim">-</dd>
      <dt>Effective</dt><dd id="st-eff">-</dd>
      <dt>Frame rate</dt><dd id="st-fps">-</dd>
    </dl>
    <h3>Notifications</h3>
    <ul id="queue" class="queue"></ul>
    <p id="queue-empty" class="muted">None queued.</p>
  </section>

  <section aria-labelledby="h-power">
    <h2 id="h-power">Power and brightness</h2>
    <label class="row"><input type="checkbox" id="power"> Panel on</label>
    <label for="brightness">Brightness: <output id="bright-out" for="brightness">255</output></label>
    <input type="range" id="brightness" min="0" max="255" step="1" value="255">
  </section>

  <section aria-labelledby="h-scenes">
    <h2 id="h-scenes">Scenes</h2>
    <div id="scenes" class="buttons" role="group" aria-label="Scene picker"></div>
  </section>

  <section aria-labelledby="h-notify">
    <h2 id="h-notify">Notify</h2>
    <form id="notify-form">
      <fieldset>
        <legend>Show</legend>
        <label class="inline"><input type="radio" name="kind" value="text" checked> Text</label>
        <label class="inline"><input type="radio" name="kind" value="scene"> Scene</label>
      </fieldset>
      <div id="n-text-fields">
        <label for="n-text">Text</label>
        <input type="text" id="n-text" maxlength="500" autocomplete="off">
        <label for="n-icon">Icon</label>
        <select id="n-icon"><option value="">none</option></select>
        <label for="n-color">Colour</label>
        <input type="color" id="n-color" value="#ffffff">
      </div>
      <div id="n-scene-fields" hidden>
        <label for="n-scene">Scene</label>
        <select id="n-scene"></select>
      </div>
      <div class="grid3">
        <div><label for="n-dur">Seconds</label>
          <input type="number" id="n-dur" value="10" min="1" max="3600" step="any"></div>
        <div><label for="n-prio">Priority</label>
          <input type="number" id="n-prio" value="0" min="-100" max="100" step="1"></div>
        <div><label for="n-rep">Repeat</label>
          <input type="number" id="n-rep" value="1" min="1" max="100" step="1"></div>
      </div>
      <div class="buttons">
        <button type="submit" class="primary">Send</button>
        <button type="button" id="n-clear">Clear all</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="h-push">
    <h2 id="h-push">Push a value</h2>
    <form id="push-form">
      <label for="p-key">Key</label>
      <input type="text" id="p-key" autocomplete="off" autocapitalize="none" spellcheck="false" value="push:">
      <label for="p-value">Value</label>
      <input type="text" id="p-value" autocomplete="off">
      <label for="p-unit">Unit (numbers only, optional)</label>
      <input type="text" id="p-unit" autocomplete="off">
      <div class="buttons">
        <button type="submit" class="primary">Push</button>
        <button type="button" id="p-remove">Remove</button>
      </div>
    </form>
  </section>
</main>

<div id="toasts" role="status" aria-live="polite"></div>
<script src="/app/app.js"></script>
</body>
</html>
