# paneld example config. See DESIGN.md §8 for the full planned schema;
# only what the current milestone implements is accepted here.

# Edits to this file are picked up live by `paneld run` (polled every second,
# applied once the content is stable; `kill -HUP` reloads at once). Scenes,
# zones, widgets and the playlist reload; canvas size, canvas.fps, [http] and
# [[output]] need a restart (a size change is rejected). A config with errors
# is logged and ignored; the old one keeps running.

[canvas]
width = 172        # two 172x86 panels (1/43 scan) stacked vertically
height = 172
fps = 30           # 1..=60

[[output]]
type = "preview"   # served at http://<http.bind>/preview
scale = 4
grid = true

# Colorlight 5A-75B over raw Ethernet. Needs CAP_NET_RAW and a NIC, so it is
# commented out here. See deploy/README.md for bring-up.
# [[output]]
# type = "colorlight"
# interface = "eth1"            # required, one output per interface
# gamma = 2.2                   # 1.0..=4.0, default 2.2
# brightness = 180              # 0..=255, default 255
# white_point = "#ffd8b0"       # colour of full white, default "#ffffff"
# brightness_mode = "hardware"  # "hardware" (card display frame) or "software" (LUT)
# color_order = "rgb"           # wire byte order: rgb, rbg, grb, gbr, brg, bgr
#                               # (find it with `paneld test-pattern --pattern bars`)
# firmware_major = 11           # optional override if card discovery fails
# sync_gap_us = 500             # 0..=20000, gap before the display frame

# Data sources (DESIGN.md §6) write store keys that widgets and conditions read.
# More source types arrive in M3: home_assistant, aircraft, mqtt, http_poll,
# prometheus. Put personal settings (your location, entity IDs) in a
# git-ignored config/local.toml, never in this file.
# [sources.demo]
# type = "static"            # fixed values, written once at start
# values = { "ha:sensor.outside_temperature" = 21.5 }
#
# Aircraft overhead (DESIGN.md §6.1): writes aircraft:count, aircraft:nearest.*
# and aircraft:list (keys use the source's name). adsb.fi is for personal,
# non-commercial use and is credited on the preview page. This location is
# Sydney airport; use your own in config/local.toml, never here. It is rounded
# to location_decimals before it is sent.
# [sources.aircraft]
# type = "aircraft"
# location = { lat = -33.94, lon = 151.18 }
# location_decimals = 2      # 0..=6; 2 is about 1 km
# radius_nm = 10             # 1..=250
# max_altitude_ft = 15000    # optional
# include_ground = false
# interval_s = 15            # >= 1; adsb.fi allows 1 request/s
# routes = true              # look up origin/destination on adsbdb
# list_len = 5               # 1..=20 entries in aircraft:list
# # url = "http://receiver.local/tar1090/data/aircraft.json"   # a local readsb

[http]
bind = "127.0.0.1:8080"

# BDF fonts, usable as `font = "name"` in any text, clock or value widget.
# `path` is relative to this file and is read when the config loads, so a
# missing or malformed file is a config error. Built-in names (6x10, 10x20,
# ...) are always available; `font_scale = N` (1..=8) blows up any font.
[[font]]
name = "spleen-32x64"
path = "../assets/fonts/spleen-32x64.bdf"
[[font]]
name = "spleen-16x32"
path = "../assets/fonts/spleen-16x32.bdf"

# Scenes rotate in the order listed below.
[playlist]
default_duration_s = 10   # for scenes without their own duration_s; > 0, max 86400

[[scene]]
name = "home"
duration_s = 20           # seconds on screen per turn
  # Top panel: y 0..86
  [[scene.zone]]
  rect = { x = 0, y = 0, w = 172, h = 64 }
  widget = { type = "clock", format = "%H:%M", font = "spleen-32x64", color = "#ffaa00" }
  [[scene.zone]]
  rect = { x = 0, y = 64, w = 172, h = 22 }
  widget = { type = "clock", format = "%a %d %b", font = "6x10", font_scale = 2, color = "#80c0ff" }
  # Bottom panel: y 86..172
  [[scene.zone]]
  rect = { x = 0, y = 86, w = 172, h = 22 }
  background = "#101030"
  widget = { type = "text", text = "Hello from paneld", font = "9x15", scroll_px_per_s = 30 }
  # A text zone can be a template: {source:name} or {source:name:spec}, with
  # the same spec as `format` (here: one decimal). Missing values show "--".
  # `{{` and `}}` are literal braces.
  [[scene.zone]]
  rect = { x = 0, y = 108, w = 172, h = 21 }
  widget = { type = "text", text = "Out {ha:sensor.outside_temperature:.1}°C", font = "9x15", color = "#80c0ff" }
  # Data sources arrive in M3. Until a source writes these keys the widgets
  # show a dim "--" (value) or nothing (sparkline).
  [[scene.zone]]
  rect = { x = 0, y = 129, w = 172, h = 21 }
  widget = { type = "value", key = "ha:sensor.outside_temperature", format = "{:.1}", unit = "°C", icon = "thermometer", font = "9x15", color = "#40a0ff", align = "center", stale_after_s = 900, thresholds = [
    { above = 20.0, color = "#00ff80" }, { above = 28.0, color = "#ff4000" } ] }
  # A weather entity's state as icon + text; `condition_icons = {}` uses the
  # built-in map of Home Assistant's conditions (sunny, rainy, ...). Add
  # entries to override, or `show_text = false` for the icon alone.
  # [[scene.zone]]
  # rect = { x = 0, y = 150, w = 172, h = 22 }
  # widget = { type = "value", key = "ha:weather.home", condition_icons = {}, font = "9x15" }
  [[scene.zone]]
  rect = { x = 0, y = 150, w = 172, h = 22 }
  widget = { type = "sparkline", key = "prom:house_power_series", color = "#ffaa00", fill = true, points = 120 }

# Shown only while the condition holds; otherwise skipped (and left at once if
# it turns false mid-display). A missing key or a type mismatch counts as false.
# Syntax: `key op literal` with > >= < <= == !=, bare `key` for truthy, plus
# ! && || and parentheses, e.g. "prom:house_power > 0 && !ha:binary_sensor.away".
[[scene]]
name = "banner"
duration_s = 5
condition = "prom:house_power > 0"
  [[scene.zone]]
  rect = { x = 0, y = 0, w = 172, h = 172 }
  widget = { type = "text", text = "paneld", font = "10x20", font_scale = 2, color = "#00ff80" }

# A still image (or animated GIF) scaled into a zone. `path` is relative to
# this file and is loaded when the config loads; use `key = "media:..."`
# instead to show an image a source put in the store (M3).
[[scene]]
name = "image"
  [[scene.zone]]
  rect = { x = 0, y = 0, w = 172, h = 86 }
  background = "#101010"
  widget = { type = "image", path = "../assets/example.png", fit = "contain" }
  #   fit = "contain" (default) | "cover" | "stretch" | "none"
  #   align = "center" (default) | "top" | "bottom" | "left" | "right"
  #           | "top_left" | "top_right" | "bottom_left" | "bottom_right"
  #   smooth = true     # average pixels when shrinking (photos); default false
  #   loop = false      # GIF: stop on the last frame; default true
  [[scene.zone]]
  rect = { x = 0, y = 86, w = 172, h = 86 }
  widget = { type = "text", text = "image widget", font = "9x15" }
