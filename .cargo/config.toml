# Cross-compiling for the Raspberry Pi (64-bit Pi OS): on Debian/Ubuntu install
# `gcc-aarch64-linux-gnu` and `rustup target add aarch64-unknown-linux-gnu`, then
#   cargo build --release --locked --target aarch64-unknown-linux-gnu -p paneld
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
